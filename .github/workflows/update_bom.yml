name: Perbarui data BoM

on:
  schedule:
    - cron: '17 21 * * *'     # 21:17 UTC = 05:17 WITA, tiap hari (BoM memperbarui mingguan)
  workflow_dispatch:           # tombol "Run workflow" untuk menjalankan manual

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unduh & konversi
        run: python fetch_bom.py
      - name: Commit bila ada perubahan
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Perbarui data BoM Niño-3.4"
            git push
          else
            echo "data.json tidak berubah"
          fi
