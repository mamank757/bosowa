name: build-indices
on:
  schedule:
    - cron: '15 3 * * *'      # setelah update-rmm (02:30 UTC)
  workflow_dispatch:
  workflow_run:               # jalan otomatis setelah update-waves selesai
    workflows: [update-waves]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  indices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pasang pustaka
        run: pip install pandas numpy
      - name: Bangun monthly.json (DMI + MJO + Kelvin + Rossby)
        run: |
          # Bila nama file Kelvin/Rossby berbeda, tulis jalurnya di sini:
          #   --kelvin data/waves/kelvin.csv --rossby data/waves/rossby.csv
          # --rmm-url: cadangan bila data/waves/rmm.txt belum ada di repo ini (diunduh dari repo lama).
          python scripts/build_indices.py \
            --rmm-url https://raw.githubusercontent.com/mamank757/dasarian/refs/heads/main/data/waves/rmm.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/indices/
          git diff --staged --quiet || (git commit -m "Perbarui indeks bulanan" && git pull --rebase && git push)
